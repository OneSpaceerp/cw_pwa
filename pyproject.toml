[project]
name = "cw_pwa"
authors = [
    { name = "Nest Software Development", email = "info@nsd-eg.com" },
    { name = "C-Water", email = "info@cw-eg.com" }
]
description = "Installable mobile app for C-Water field engineers on ERPNext v16"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "B904", "W191", "E101", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
